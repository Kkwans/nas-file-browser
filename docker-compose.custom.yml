# NAS File Browser - Docker Compose (Custom Build)
# Build and run: docker-compose -f docker-compose.custom.yml up -d --build

services:
  filebrowser:
    build:
      context: .
      dockerfile: Dockerfile.custom
    container_name: nas-file-browser
    restart: unless-stopped
    ports:
      - "8888:80"
    volumes:
      - /volume1:/volume1:ro            # NAS 存储卷 1（主存储，7.3T）
      - /volume2:/volume2:ro            # NAS 存储卷 2（扩展存储，7.3T）
      - ./config:/config                # FileBrowser config
      - ./database:/database            # FileBrowser database (users, settings)
    environment:
      - FB_DATABASE=/database/filebrowser.db
      - FB_ROOT=/
      - FB_LOGLEVEL=info
